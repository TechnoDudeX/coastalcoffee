    // document mints the blobs for its OWN frames, obtaining page text

    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    const resourceBlobs = {};

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        UUID_SHAPE.test(d.__bundler_page) &&

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

!important}\n  .cc-how>div{gap:28px!important}\n  .cc-menu{padding-top:52px!important;padding-bottom:52px!important}\n  .cc-menu h2,.cc-about h2{font-size:36px!important}\n  .cc-builder{gap:28px!important}\n  .cc-stage{zoom:.8}\n  .cc-stage .cc-tag{zoom:1.25}\n  .cc-overlay{align-items:flex-end!important;padding:0!important}\n  .cc-sheet{border-radius:20px 20px 0 0!important;padding:22px 18px calc(22px + env(safe-area-inset-bottom))!important;gap:18px!important}\n  .cc-about>div{gap:32px!important}\n  .cc-add{letter-spacing:.04em!important;font-size:12.5px!important;white-space:nowrap;padding:0 8px!important}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#F6EFDF;color:#123F5E;font-family:'Josefin Sans',system-ui,sans-serif\">\n\n<header class=\"cc-hero\" data-screen-label=\"Hero\" style=\"padding:22px 24px 72px\">\n<div style=\"max-width:1080px;margin:0 auto\">\n<nav class=\"cc-nav\" style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n<div style=\"display:flex;align-items:baseline;gap:10px\">\n<span style=\"font-weight:700;letter-spacing:.28em;font-size:13px\">COASTAL COFFEE<\u002Fspan>\n<span style=\"font-family:'Reem Kufi',sans-serif;font-size:16px;color:#C96F4A\">قهوة الساحل<\u002Fspan>\n<\u002Fdiv>\n<div class=\"cc-navlinks\" style=\"display:flex;gap:22px;font-size:12px;font-weight:600;letter-spacing:.2em\">\n<a href=\"#menu\" style=\"text-decoration:none\">BUILD A DRINK<\u002Fa>\n<a href=\"#how\" style=\"text-decoration:none\">HOW IT WORKS<\u002Fa>\n<a href=\"#about\" style=\"text-decoration:none\">ABOUT<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<div class=\"cc-herorow\" style=\"display:flex;flex-wrap:wrap-reverse;align-items:center;justify-content:space-between;gap:40px;margin-top:56px\">\n<div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:22px\">\n<div class=\"cc-eyebrow\" style=\"font-size:12px;font-weight:600;letter-spacing:.32em;color:#3E8C94\">WEEKDAYS · 6–9 AM · DRIVEWAY PICKUP<\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Marcellus',serif;font-weight:400;font-size:clamp(42px,6vw,68px);line-height:1.04;text-wrap:balance\">Sa7el mornings, poured to go.<\u002Fh1>\n<p style=\"margin:0;font-size:18px;line-height:1.55;color:#3D5566;max-width:460px;text-wrap:pretty\">Order ahead, pick a 15-minute window, and pull up — your coffee will be waiting. Pay at pickup, cash or card.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:4px\">\n<a href=\"#menu\" class=\"cc-herocta\" style=\"display:inline-flex;align-items:center;height:50px;padding:0 26px;border-radius:999px;background:#123F5E;color:#F4E9D2;text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.14em\">START YOUR ORDER<\u002Fa>\n<div class=\"cc-status\" style=\"display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 18px;border-radius:999px;border:1px solid rgba(18,63,94,.2);font-size:14px\">\n<span style=\"width:9px;height:9px;border-radius:50%;background:{{ statusColor }}\"><\u002Fspan>\n<span>{{ statusText }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cc-herologo\" style=\"flex:0 1 340px;display:grid;place-items:center;min-width:220px\">\n<svg sc-camel-view-box=\"0 0 360 360\" style=\"width:100%;max-width:340px;height:auto\" role=\"img\" aria-label=\"Coastal Coffee logo\">\n<circle cx=\"180\" cy=\"180\" r=\"168\" fill=\"#123F5E\"><\u002Fcircle>\n<circle cx=\"180\" cy=\"180\" r=\"153\" fill=\"none\" stroke=\"#F4E9D2\" stroke-opacity=\"0.5\" stroke-width=\"1\"><\u002Fcircle>\n<circle cx=\"180\" cy=\"180\" r=\"97\" fill=\"none\" stroke=\"#F4E9D2\" stroke-opacity=\"0.5\" stroke-width=\"1\"><\u002Fcircle>\n<path id=\"heroTop\" d=\"M 63,180 A 117,117 0 0 1 297,180\" fill=\"none\"><\u002Fpath>\n<text font-family=\"'Josefin Sans',sans-serif\" font-size=\"23\" font-weight=\"600\" letter-spacing=\"7\" fill=\"#F4E9D2\"><textPath href=\"#heroTop\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">COASTAL COFFEE<\u002FtextPath><\u002Ftext>\n<path id=\"heroBot\" d=\"M 43,180 A 137,137 0 0 0 317,180\" fill=\"none\"><\u002Fpath>\n<text font-family=\"'Reem Kufi',sans-serif\" font-weight=\"700\" font-size=\"32\" word-spacing=\"10\" fill=\"#F4E9D2\"><textPath href=\"#heroBot\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">قـهـوة السـاحـل<\u002FtextPath><\u002Ftext>\n<rect x=\"-4.5\" y=\"-4.5\" width=\"9\" height=\"9\" fill=\"#E0A93E\" transform=\"translate(45 180) rotate(45)\"><\u002Frect>\n<rect x=\"-4.5\" y=\"-4.5\" width=\"9\" height=\"9\" fill=\"#E0A93E\" transform=\"translate(315 180) rotate(45)\"><\u002Frect>\n<circle cx=\"80\" cy=\"262\" r=\"2.2\" fill=\"#F4E9D2\"><\u002Fcircle>\n<circle cx=\"280\" cy=\"262\" r=\"2.2\" fill=\"#F4E9D2\"><\u002Fcircle>\n<g transform=\"translate(180 191) scale(1.21) translate(-180 -191)\">\n<g transform=\"translate(180 148)\">\n<circle r=\"22\" fill=\"#E0A93E\"><\u002Fcircle>\n<path d=\"M0,-40 L0,-30 M28,-28 L21,-21 M40,0 L30,0 M28,28 L21,21 M0,40 L0,30 M-28,28 L-21,21 M-40,0 L-30,0 M-28,-28 L-21,-21\" stroke=\"#E0A93E\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n<animateTransform sc-camel-attribute-name=\"transform\" type=\"rotate\" values=\"-14;14;-14\" sc-camel-key-times=\"0;0.5;1\" sc-camel-calc-mode=\"spline\" sc-camel-key-splines=\"0.45 0 0.55 1;0.45 0 0.55 1\" dur=\"6s\" sc-camel-repeat-count=\"indefinite\"><\u002FanimateTransform>\n<\u002Fpath>\n<\u002Fg>\n<line x1=\"120\" y1=\"202\" x2=\"240\" y2=\"202\" stroke=\"#F4E9D2\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline>\n<defs>\n<linearGradient id=\"waveFade\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n<stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0\"><\u002Fstop>\n<stop offset=\"0.2\" stop-color=\"#fff\" stop-opacity=\"1\"><\u002Fstop>\n<stop offset=\"0.8\" stop-color=\"#fff\" stop-opacity=\"1\"><\u002Fstop>\n<stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"><\u002Fstop>\n<\u002FlinearGradient>\n<mask id=\"waveMask1\" sc-camel-mask-units=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"360\" height=\"360\"><rect x=\"126\" y=\"210\" width=\"108\" height=\"24\" fill=\"url(#waveFade)\"><\u002Frect><\u002Fmask>\n<mask id=\"waveMask2\" sc-camel-mask-units=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"360\" height=\"360\"><rect x=\"136\" y=\"226\" width=\"88\" height=\"24\" fill=\"url(#waveFade)\"><\u002Frect><\u002Fmask>\n<\u002Fdefs>\n<g mask=\"url(#waveMask1)\">\n<path d=\"M50,224 Q60,216 70,224 T90,224 T110,224 T130,224 T150,224 T170,224 T190,224 T210,224 T230,224 T250,224\" fill=\"none\" stroke=\"#6FB5BC\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n<animateTransform sc-camel-attribute-name=\"transform\" type=\"translate\" from=\"0 0\" to=\"40 0\" dur=\"4.8s\" sc-camel-repeat-count=\"indefinite\"><\u002FanimateTransform>\n<\u002Fpath>\n<\u002Fg>\n<g mask=\"url(#waveMask2)\">\n<path d=\"M100,240 Q110,232 120,240 T140,240 T160,240 T180,240 T200,240 T220,240 T240,240 T260,240 T280,240\" fill=\"none\" stroke=\"#6FB5BC\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n<animateTransform sc-camel-attribute-name=\"transform\" type=\"translate\" from=\"0 0\" to=\"-40 0\" dur=\"6.4s\" sc-camel-repeat-count=\"indefinite\"><\u002FanimateTransform>\n<\u002Fpath>\n<\u002Fg>\n<\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"how\" class=\"cc-how\" data-screen-label=\"How it works\" style=\"background:#123F5E;color:#F4E9D2;padding:56px 24px\">\n<div style=\"max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:36px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:'Marcellus',serif;font-size:30px;color:#E0A93E\">01<\u002Fdiv>\n<div style=\"font-size:15px;font-weight:600;letter-spacing:.16em\">ORDER AHEAD<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:1.55;color:#C9D6DE\">Pick your drinks and a 15-minute pickup window, weekdays 6–9 AM.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:'Marcellus',serif;font-size:30px;color:#E0A93E\">02<\u002Fdiv>\n<div style=\"font-size:15px;font-weight:600;letter-spacing:.16em\">GET THE ADDRESS BY TEXT<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:1.55;color:#C9D6DE\">Once your order's in, we text you the driveway address.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-family:'Marcellus',serif;font-size:30px;color:#E0A93E\">03<\u002Fdiv>\n<div style=\"font-size:15px;font-weight:600;letter-spacing:.16em\">PULL UP &amp; PAY<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:1.55;color:#C9D6DE\">Cash or card at pickup. Your drink is ready and waiting.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ ownerMode }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Owner view\" style=\"padding:48px 24px 0\">\n<div style=\"max-width:1080px;margin:0 auto;background:#FBF6E9;border:1.5px dashed #C96F4A;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-family:'Marcellus',serif;font-size:26px\">Reem's view · Incoming orders<\u002Fdiv>\n<sc-if value=\"{{ noOrders }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size:15px;color:#6B5F4C\">No orders yet.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{ ownerOrders }}\" as=\"o\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px;background:#F6EFDF;border-radius:12px\">\n<div style=\"font-weight:700;font-size:14px;letter-spacing:.08em\">{{ o.num }}<\u002Fdiv>\n<div style=\"font-weight:600;font-size:14px;color:#3E8C94\">{{ o.slot }}<\u002Fdiv>\n<div style=\"flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:3px\">\n<div style=\"font-size:15px;font-weight:600\">{{ o.name }} · {{ o.phone }}<\u002Fdiv>\n<div style=\"font-size:14px;color:#5B5244;line-he tchBorder }};flex:none\"><\u002Fspan>\n<span>{{ o.label }}<\u002Fspan>\n<span style=\"font-weight:400;font-size:12px;opacity:.8\">{{ o.extra }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'Marcellus',serif;font-size:20px;color:#C96F4A\">07<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em\">SIZE<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ sizeChips }}\" as=\"o\" hint-placeholder-count=\"2\">\n<button sc-camel-on-click=\"{{ o.onClick }}\" style=\"min-height:44px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid #123F5E;background:{{ o.bg }};color:{{ o.fg }};opacity:{{ o.opacity }};cursor:{{ o.cursor }};display:flex;align-items:center;gap:8px;font:600 14px 'Josefin Sans',sans-serif;transition:background .2s,color .2s\">\n<span style=\"width:14px;height:14px;border-radius:50%;background:{{ o.swatch }};border:1px solid {{ o.swatchBorder }};flex:none\"><\u002Fspan>\n<span>{{ o.label }}<\u002Fspan>\n<span style=\"font-weight:400;font-size:12px;opacity:.8\">{{ o.extra }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'Marcellus',serif;font-size:20px;color:#C96F4A\">08<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em\">SWEETNESS<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n<sc-for list=\"{{ sugarChips }}\" as=\"o\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ o.onClick }}\" style=\"min-height:56px;padding:8px 4px;border-radius:14px;border:1.5px solid #123F5E;background:{{ o.bg }};color:{{ o.fg }};font:600 14px 'Josefin Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .2s,color .2s\"><span>{{ o.label }}<\u002Fspan><span style=\"font-weight:400;font-size:11px;letter-spacing:.04em\">{{ o.sub }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ addToOrder }}\" style=\"height:56px;border-radius:999px;border:none;background:{{ addBg }};color:#FBF6E9;font:600 14px 'Josefin Sans',sans-serif;letter-spacing:.12em;cursor:pointer\">{{ addLabel }}<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" class=\"cc-about\" data-screen-label=\"About\" style=\"padding:0 24px 88px\">\n<div style=\"max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:48px;align-items:center\">\n<div style=\"width:100%;aspect-ratio:4/5;position:relative\"><image-slot id=\"reem-photo\" shape=\"rounded\" radius=\"18\" placeholder=\"Photo of Reem or the driveway setup\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"font-size:12px;font-weight:600;letter-spacing:.32em;color:#3E8C94\">ABOUT<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n<h2 style=\"margin:0;font-family:'Marcellus',serif;font-weight:400;font-size:44px\">Brewed by Reem<\u002Fh2>\n<span style=\"font-family:'Reem Kufi',sans-serif;font-size:22px;color:#C96F4A\">من ريم<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:18px;line-height:1.6;color:#3D5566;text-wrap:pretty\">Coastal Coffee is a little piece of Egypt's Sa7el summers — slow mornings, Turkish coffee with cardamom, mango and hibiscus by the sea — poured into a to-go cup.<\u002Fp>\n<p style=\"margin:0;font-size:18px;line-height:1.6;color:#3D5566;text-wrap:pretty\">Every drink is made to order, right from Reem's driveway, before your day begins.<\u002Fp>\n<a href=\"https://instagram.com/\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:1.5px solid #123F5E;text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.14em\">FOLLOW @COASTAL.COFFEE<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"cc-footer\" style=\"background:#123F5E;color:#C9D6DE;padding:40px 24px 120px\">\n<div style=\"max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center\">\n<div style=\"display:flex;align-items:baseline;gap:10px\">\n<span style=\"font-weight:700;letter-spacing:.28em;font-size:13px;color:#F4E9D2\">COASTAL COFFEE<\u002Fspan>\n<span style=\"font-family:'Reem Kufi',sans-serif;font-size:16px;color:#9AD5CE\">قهوة الساحل<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size:14px;letter-spacing:.04em\">Weekdays 6–9 AM · Driveway pickup · Address sent by text<\u002Fdiv>\n<a href=\"https://instagram.com/\" target=\"_blank\" rel=\"noopener\" style=\"color:#F4E9D2;font-size:14px;font-weight:600;letter-spacing:.08em\">Instagram<\u002Fa>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ hasCart }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ openCheckout }}\" class=\"cc-cart\" style=\"position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 32px);max-width:560px;height:60px;border:none;border-radius:999px;background:#C96F4A;color:#FBF6E9;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 15px 'Josefin Sans',sans-serif;letter-spacing:.06em;box-shadow:0 10px 30px rgba(18,63,94,.28);cursor:pointer;z-index:40\">\n<span>{{ cartSummary }}<\u002Fspan>\n<span style=\"letter-spacing:.14em;font-size:13px\">REVIEW ORDER →<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ coOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeCheckout }}\" class=\"cc-overlay\" style=\"position:fixed;inset:0;background:rgba(14,40,58,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50\">\n<div sc-camel-on-click=\"{{ stop }}\" class=\"cc-sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Your order\" style=\"background:#FBF6E9;border-radius:20px;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n<div style=\"font-family:'Marcellus',serif;font-size:30px\">Your order<\u002Fdiv>\n<button sc-camel-on-click=\"{{ closeCheckout }}\" aria-label=\"Close\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid rgba(18,63,94,.2);background:transparent;color:#123F5E;font-size:20px;cursor:pointer\">×<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column\">\n<sc-for list=\"{{ cartLines }}\" as=\"l\" hint-placeholder-count=\"1\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid rgba(18,63,94,.12)\">\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\">\n<div style=\"font-weight:600;font-size:16px\">{{ l.title }}<\u002Fdiv>\n<div style=\"font-size:14px;color:#6B5F4C;line-height:1.4\">{{ l.details }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-weight:600;font-size:15px\">{{ l.price }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ l.onRemove }}\" style=\"height:44px;margin:-8px -4px 0 0;padding:0 8px;border:none;background:transparent;color:#C96F4A;font:600 12px 'Josefin Sans',sans-serif;letter-spacing:.1em;cursor:pointer;text-decoration:underline\">REMOVE<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display:flex;justify-content:space-between;padding-top:14px;font-weight:700;font-size:17px\"><span>Total · pay at pickup<\u002Fspan><span>{{ cartTotal }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:12px;font-weight:600;letter-spacing:.24em;color:#6B5F4C\">PICKUP · {{ slotDay }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px\">\n<sc-for list=\"{{ slotChips }}\" as=\"s\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ s.onClick }}\" style=\"height:44px;border-radius:12px;border:1.5px solid #123F5E;background:{{ s.bg }};color:{{ s.fg }};font:600 14px 'Josefin Sans',sans-serif;cursor:pointer\">{{ s.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.2em;color:#6B5F4C\">NAME\n<input value=\"{{ name }}\" name=\"name\" autocomplete=\"name\" autocapitalize=\"words\" enterkeyhint=\"next\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Your name\" style=\"height:48px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(18,63,94,.25);background:#FFFDF7;color:#123F5E;font:400 16px 'Josefin Sans',sans-serif;letter-spacing:0;outline:none\" style-focus=\"border-color:#123F5E\">\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.2em;color:#6B5F4C\">PHONE\n<input type=\"tel\" value=\"{{ phone }}\" name=\"phone\" autocomplete=\"tel\" inputmode=\"tel\" enterkeyhint=\"next\" sc-camel-on-change=\"{{ setPhone }}\" placeholder=\"For the address text\" style=\"height:48px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(18,63,94,.25);background:#FFFDF7;color:#123F5E;font:400 16px 'Josefin Sans',sans-serif;letter-spacing:0;outline:none\" style-focus=\"border-color:#123F5E\">\n<\u002Flabel>\n<\u002Fdiv>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.2em;color:#6B5 =\"#E0A93E\"><\u002Fpath>\n<path d=\"M18,46 Q24,40 30,46 T42,46 T54,46 T66,46\" fill=\"none\" stroke=\"#3E8C94\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M28,57 Q34,51 40,57 T52,57 T60,57\" fill=\"none\" stroke=\"#3E8C94\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"font-size:12px;font-weight:600;letter-spacing:.3em;color:#3E8C94\">ORDER {{ confNum }}<\u002Fdiv>\n<div style=\"font-family:'Marcellus',serif;font-size:30px;line-height:1.15\">Shukran, {{ confName }}!<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:1.55;color:#3D5566\">Reem will text the pickup address to <b>{{ confPhone }}<\u002Fb>.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 20px;border-radius:12px;background:#F6EFDF;width:100%\">\n<div style=\"font-weight:700;font-size:17px\">{{ confSlot }}<\u002Fdiv>\n<div style=\"font-size:14px;color:#6B5F4C\">{{ confTotal }} due at pickup · cash or card<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ confClose }}\" style=\"margin-top:6px;height:50px;padding:0 32px;border-radius:999px;border:none;background:#123F5E;color:#F4E9D2;font:600 14px 'Josefin Sans',sans-serif;letter-spacing:.14em;cursor:pointer\">DONE<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;ownerMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Preview&quot;},&quot;previewTime&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;live&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;open&quot;,&quot;closed&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Preview&quot;}}\">\nconst BASES = [\n  { id: 'espresso', label: 'Espresso', ar: 'اسبريسو', color: '#4A2C1A', price: 4.5, temps: ['iced', 'hot'], milk: true },\n  { id: 'coldbrew', label: 'Cold Brew', ar: 'كولد برو', color: '#2E1C12', price: 5, temps: ['iced'], milk: true },\n  { id: 'ahwa', label: 'Turkish Ahwa', ar: 'قهوة تركي', color: '#3A2416', price: 3.5, temps: ['hot'], milk: false },\n  { id: 'karkadeh', label: 'Karkadeh', ar: 'كركديه', color: '#9B1F45', price: 4, temps: ['iced', 'hot'], milk: false },\n  { id: 'lemon', label: 'Lemon Mint', ar: 'ليمون نعناع', color: '#BFD46A', price: 4, temps: ['iced'], milk: false }\n];\nconst TEMPS = [{ id: 'iced', label: 'Iced', color: '#BFE3E6' }, { id: 'hot', label: 'Hot', color: '#E07B4F' }];\nconst MILKS = [\n  { id: 'none', label: 'No milk', color: null, add: 0 }, { id: 'whole', label: 'Whole', color: '#F4EDE1', add: 0 },\n  { id: 'oat', label: 'Oat', color: '#EADDC4', add: 0.75 }, { id: 'almond', label: 'Almond', color: '#F0E6D6', add: 0.75 },\n  { id: 'condensed', label: 'Condensed', color: '#EBD3A6', add: 0.5 }\n];\nconst FLAVORS = [\n  { id: 'none', label: 'None', color: null, add: 0 }, { id: 'vanilla', label: 'Vanilla', color: '#E9D8A6', add: 0.5 },\n  { id: 'caramel', label: 'Caramel', color: '#C27A2C', add: 0.5 }, { id: 'cardamom', label: 'Cardamom', color: '#A9A66B', add: 0.5 },\n  { id: 'rose', label: 'Rose', color: '#E7A1B0', add: 0.5 }, { id: 'mango', label: 'Mango purée', color: '#F4A934', add: 1 },\n  { id: 'honey', label: 'Honey', color: '#E3A23B', add: 0.5 }\n];\nconst CREAMS = [\n  { id: 'none', label: 'None', color: null, add: 0 }, { id: 'foam', label: 'Cold foam', color: '#F6EFE2', add: 1 },\n  { id: 'whip', label: 'Whipped cream', color: '#FFF9EE', add: 0.75 }, { id: 'ashta', label: 'Ashta', color: '#FFF4DA', add: 1 }\n];\nconst TOPPINGS = [\n  { id: 'pistachio', label: 'Pistachio', color: '#8DB255', add: 0.5 }, { id: 'cinnamon', label: 'Cinnamon', color: '#9A5B2E', add: 0 },\n  { id: 'cocoa', label: 'Cocoa', color: '#4B2E22', add: 0 }, { id: 'rosepetal', label: 'Rose petals', color: '#D9667F', add: 0.5 },\n  { id: 'drizzle', label: 'Caramel drizzle', color: '#C27A2C', add: 0.5 }, { id: 'cardamomdust', label: 'Cardamom dust', color: '#9C9A5E', add: 0 }\n];\nconst SIZES = [{ id: '12', label: '12 oz', color: null, add: 0 }, { id: '16', label: '16 oz', color: null, add: 1 }];\nconst SUGARS = [{ id: 'sada', label: 'None', sub: 'sada' }, { id: 'riha', label: 'Light', sub: '3al ree7a' }, { id: 'mazboot', label: 'Medium', sub: 'mazboot' }, { id: 'ziyada', label: 'Extra', sub: 'ziyada' }];\nconst PRESETS = [\n  { name: 'Sa7el Iced Latte', ar: 'لاتيه الساحل', cfg: { base: 'espresso', temp: 'iced', milk: 'whole', flavor: 'vanilla', cream: 'none', tops: [] } },\n  { name: 'Spanish Latte', ar: 'سبانش لاتيه', cfg: { base: 'espresso', temp: 'iced', milk: 'condensed', flavor: 'none', cream: 'none', tops: [] } },\n  { name: 'Mango Cold Brew', ar: 'كولد برو مانجو', cfg: { base: 'coldbrew', temp: 'iced', milk: 'none', flavor: 'mango', cream: 'foam', tops: [] } },\n  { name: 'Pistachio Rose Latte', ar: 'لاتيه فستق و ورد', cfg: { base: 'espresso', temp: 'iced', milk: 'oat', flavor: 'rose', cream: 'foam', tops: ['pistachio', 'rosepetal'] } },\n  { name: 'Ahwa Mazboot', ar: 'قهوة مظبوط', cfg: { base: 'ahwa', temp: 'hot', milk: 'none', flavor: 'cardamom', cream: 'none', tops: [] } },\n  { name: 'Iced Karkadeh', ar: 'كركديه ساقع', cfg: { base: 'karkadeh', temp: 'iced', milk: 'none', flavor: 'honey', cream: 'none', tops: [] } }\n];\nconst GROUPS = [['base', 'BASE', BASES], ['milk', 'MILK', MILKS], ['flavor', 'FLAVOR', FLAVORS], ['cream', 'CREAM', CREAMS], ['top', 'TOPPING', TOPPINGS]];\nconst DUST = ['cinnamon', 'cocoa', 'cardamomdust'];\nconst OPEN = 360, LAST = 525, CLOSE = 540;\nconst find = (arr, id) => arr.find(x => x.id === id);\nconst money = n => '$' + n.toFixed(2);\nconst fmtMin = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' AM';\nconst isWk = d => d.getDay() > 0 && d.getDay() < 6;\nconst load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };\nconst save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };\nconst noop = () => {};\n\nclass Component extends DCLogic {\n  state = {\n    cfg: { ...PRESETS[0].cfg, tops: [], size: '12', sugar: 'mazboot' }, qty: 1, added: false, wide: true,\n    cart: [], co: false, slot: null, name: '', phone: '', note: '', conf: null,\n    sold: load('cc_sold2', {}), orders: load('cc_orders', [])\n  };\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(min-width: 900px)');\n    this.onMq = () => this.setState({ wide: this.mq.matches });\n    this.onMq();\n    this.mq.addEventListener('change', this.onMq);\n  }\n  componentWillUnmount() { if (this.mq) this.mq.removeEventListener('change', this.onMq); clearTimeout(this.addT); }\n\n  now() {\n    const p = this.props.previewTime ?? 'live';\n    const d = new Date();\n    if (p === 'open') { while (!isWk(d)) d.setDate(d.getDate() + 1); d.setHours(6, 20, 0, 0); }\n    if (p === 'closed') { while (d.getDay() !== 6) d.setDate(d.getDate() + 1); d.setHours(10, 0, 0, 0); }\n    return d;\n  }\n\n  schedule() {\n    const now = this.now();\n    const nm = now.getHours() * 60 + now.getMinutes();\n    let slots = [];\n    if (isWk(now)) for (let m = OPEN; m <= LAST; m += 15) if (m >= nm + 10) slots.push(m);\n    let label = 'Today';\n    if (!slots.length) {\n      const day = new Date(now);\n      do { day.setDate(day.getDate() + 1); } while (!isWk(day));\n      for (let m = OPEN; m <= LAST; m += 15) slots.push(m);\n      const diff = Math.round((new Date(day.toDateString()) - new Date(now.toDateString())) / 864e5);\n      label = diff === 1 ? 'Tomorrow' : day.toLocaleDateString('en-US', { weekday: 'long' });\n    }\n    const openNow = isWk(now) && nm >= OPEN && nm < CLOSE && label === 'Today';\n    return { openNow, label, slots };\n  }\n\n  isSold(g, id) { return !!this.state.sold[g + ':' + id]; }\n\n  setCfg(patch) {\n    this.setState(s => {\n      const c = { ...s.cfg, ...patch };\n      const b = find(BASES, c.base);\n      if (!b.temps.includes(c.temp)) c.temp = b.temps[0];\n      if (!b.milk) c.milk = 'none';\n      return { cfg: c };\n    });\n  }\n\n  price(c) {\n    return find(BASES, c.base).price + find(SIZES, c.size).add + find(MILKS, c.milk).add + find(FLAVORS, c.flavor).add +\n      find(CREAMS, c.cream).add + c.tops.reduce((a, t) => a + find(TOPPINGS, t).add, 0);\n  }\n\n  matchPreset(c) {\n    const tops = c.tops.slice().sort().join();\n    return PRESETS.find(p => ['base', 'temp', 'milk', 'flavor', 'cream'].every(k => p.cfg[k] === c[k]) && p.cfg.tops.slice().sort().join() === tops);\n  }\n\n  describe(c) {\n    const b = find(BASES, c.base), p = this.matchPreset(c);\n    const parts = [find(SIZES, c.size).label];\n    if (c.milk !== 'none') parts.push(find(MILKS, c.milk).label + ' milk');\n    if (c.flavor !== 'none') parts.push(find(FLAVORS, c.flavor).label);\n    if (c.cream !== 'none') parts.push(find(CREAMS, c.cream).label);\n    c.tops.forEach(t => parts.push(find(TOPPINGS, t).label));\n    parts.push(find(SUGARS, c.sugar).label + ' sugar');\n    return { name: p ? p.name : (c.temp === 'iced' ? 'Iced ' : 'Hot ') + b.label, ar: p ? p.ar : b.ar, custom: !p, details: parts.join(' · ') };\n  }\n\n  visual(c) {\n    const b = find(BASES, c.base), iced = c.temp === 'iced', m = find(MILKS, c.milk), f = find(FLAVORS, c.flavor);\n    const milkOn = c.milk !== 'none';\n    const flav = iced && f.color ? (c.flavor === 'mango' ? 14 : 6) : 0;\n    const milk = iced && milkOn ? 38 : 0;\n    const fill = iced ? 80 : 84;\n    const cream = c.cream === 'foam' ? 12 : c.cream === 'ashta' ? 9 : 0;\n    const whip = c.cream === 'whip';\n    const surface = fill + cream;\n    // Layers overlap by F px and the upper one fades in across the overlap, so they blend.\n    const F = 14, hasFlav = flav > 0, hasMilk = milk > 0, hasCream = cream > 0, belowBase = hasFlav || hasMilk;\n    const cal = (pct, px) => px ? 'calc(' + pct + '% ' + (px < 0 ? '- ' : '+ ') + Math.abs(px) + 'px)' : pct + '%';\n    const fade = on => on ? 'linear-gradient(to top, transparent, #000 ' + (2 * F) + 'px)' : 'none';\n    const dots = [];\n    c.tops.filter(t => t !== 'drizzle').forEach((tid, ti) => {\n      const t = find(TOPPINGS, tid), dust = DUST.includes(tid), n = dust ? 14 : 7;\n      for (let i = 0; i < n; i++) {\n        const w = dust ? 3 : tid === 'rosepetal' ? 10 : 6, h = dust ? 3 : tid === 'rosepetal' ? 6 : 4;\n        dots.push({\n          left: (3 + ((i * 37 + ti * 19) % 90)) + '%', bottom: ((i * 5 + ti * 3) % 9) + 'px', w: w + 'px', h: h + 'px',\n          color: t.color, rot: ((i * 53 + ti * 31) % 180) + 'deg', radius: tid === 'rosepetal' ? '60% 40% 60% 40%' : dust ? '50%' : '2px'\n        });\n      }\n    });\n    return {\n      flavH: cal(flav, hasFlav ? F : 0), flavColor: f.color || '#000000',\n      milkB: cal(flav, hasMilk && hasFlav ? -F : 0), milkH: hasMilk ? cal(milk, (hasFlav ? F : 0) + F) : '0%',\n      milkMask: fade(hasMilk && hasFlav), milkColor: m.color || '#F4EDE1',\n      baseB: cal(flav + milk, belowBase ? -F : 0), baseH: cal(fill - flav - milk, (belowBase ? F : 0) + (hasCream ? F : 0)),\n      baseMask: fade(belowBase),\n      baseColor: !iced && milkOn ? 'color-mix(in oklch, ' + b.color + ' 40%, ' + m.color + ')' : b.color,\n      creamB: cal(fill, hasCream ? -F : 0), creamH: hasCream ? cal(cream, F) : '0%', creamMask: fade(hasCream), creamColor: find(CREAMS, c.cream).color || '#F6EFE2',\n      iceOp: iced ? 1 : 0, strawOp: iced ? 1 : 0, handleOp: iced ? 0 : 1, hot: !iced,\n      domeScale: whip ? 1 : 0, cupScale: c.size === '16' ? 1 : 0.88,\n      drizzleOp: c.tops.includes('drizzle') ? 1 : 0,\n      drizzleBottom: whip ? 'calc(100% + 12px)' : 'calc(' + surface + '% - 13px)',\n      topBottom: whip ? 'calc(100% + 42px)' : 'calc(' + surface + '% - 6px)',\n      dotsInset: whip ? '30%' : '9%',\n      steamBottom: whip ? 'calc(100% + 62px)' : 'calc(100% + 6px)',\n      dots\n    };\n  }\n\n  chip(g, o, selected, blocked, onPick, extra) {\n    const sold = g ? this.isSold(g, o.id) : false, dis = sold || blocked;\n    return {\n      label: o.label, swatch: o.color || 'transparent', swatchBorder: o.color ? 'rgba(18,63,94,.2)' : 'rgba(18,63,94,.4)',\n      bg: selected ? '#123F5E' : '#FBF6E9', fg: selected ? '#F4E9D2' : '#123F5E',\n      opacity: dis ? 0.4 : 1, cursor: dis ? 'not-allowed' : 'pointer',\n      extra: sold ? 'sold out' : blocked ? 'n/a' : extra !== undefined ? extra : (o.add ? '+' + money(o.add) : ''),\n      onClick: dis ? noop : onPick\n    };\n  }\n\n  placeOrder(sch) {\n    const s = this.state;\n    const seq = load('cc_seq', 100) + 1; save('cc_seq', seq);\n    const total = s.cart.reduce((a, l) => a + l.unit * l.qty, 0);\n    const order = {\n      num: 'CC-' + seq, name: s.name.trim(), phone: s.phone.trim(), slot: sch.label + ' · ' + fmtMin(s.slot), total,\n      summary: s.cart.map(l => l.qty + '× ' + l.name + ' (' + l.details + ')').join(', ') + (s.note.trim() ? ' — Note: ' + s.note.trim() : '')\n    };\n    const orders = [order, ...s.orders];\n    save('cc_orders', orders);\n    this.setState({ orders, conf: order, cart: [], co: false, slot: null, note: '' });\n  }\n\n  renderVals() {\n    const s = this.state, c = s.cfg, sch = this.schedule(), ownerMode = this.props.ownerMode ?? false;\n    const b = find(BASES, c.base), d = this.describe(c), unit = this.price(c);\n    const cartTotalN = s.cart.reduce((a, l) => a + l.unit * l.qty, 0);\n    const cartCount = s.cart.reduce((a, l) => a + l.qty, 0);\n    const selSold = this.isSold('base', c.base) || this.isSold('milk', c.milk) || this.isSold('flavor', c.flavor) ||\n      this.isSold('cream', c.cream) || c.tops.some(t => this.isSold('top', t));\n    const canAdd = !selSold;\n\n    const digits = s.phone.replace(/\\D/g, '').length;\n    const missing = !s.slot ? 'Pick a pickup time' : !s.name.trim() ? 'Add your name' : digits < 10 ? 'Add your phone number' : '';\n    const canPlace = s.cart.length > 0 && !missing;\n\n    const presetCards = PRESETS.map(p => {\n      const on = this.matchPreset(c) === p;\n      const pc = { ...p.cfg, size: '12', sugar: c.sugar };\n      const sold = this.isSold('base', pc.base) || this.isSold('milk', pc.milk) || this.isSold('flavor', pc.flavor) || this.isSold('cream', pc.cream) || pc.tops.some(t => this.isSold('top', t));\n      return {\n        name: p.name, ar: p.ar, price: sold ? 'Sold out today' : 'from ' + money(this.price(pc)),\n        bg: on ? '#123F5E' : '#FBF6E9', fg: on ? '#F4E9D2' : '#123F5E', arColor: on ? '#9AD5CE' : '#C96F4A', opacity: sold ? 0.45 : 1,\n        onClick: sold ? noop : () => this.setState(st => ({ cfg: { ...p.cfg, tops: [...p.cfg.tops], size: st.cfg.size, sugar: p.name === 'Ahwa Mazboot' ? 'mazboot' : st.cfg.sugar } }))\n      };\n    });\n\n    return {\n      ownerMode,\n      statusText: sch.openNow ? 'Open now · last pickup 8:45 AM' : 'Closed · pre-order for ' + (sch.label === 'Tomorrow' ? 'tomorrow' : sch.label),\n      statusColor: sch.openNow ? '#3E8C94' : '#C96F4A',\n      previewPos: s.wide ? 'sticky' : 'relative', narrow: !s.wide,\n\n      ...this.visual(c),\n      tag: d.custom ? 'YOUR CREATION' : \"REEM'S PICK\",\n      cupTag: find(SIZES, c.size).label.toUpperCase() + ' · ' + c.temp.toUpperCase(),\n      drinkName: d.name, drinkAr: d.ar, drinkDetails: d.details, drinkPrice: money(unit),\n      qty: s.qty,\n      qtyInc: () => this.setState(st => ({ qty: Math.min(9, st.qty + 1) })),\n      qtyDec: () => this.setState(st => ({ qty: Math.max(1, st.qty - 1) })),\n      addLabel: s.added ? 'ADDED ✓' : canAdd ? 'ADD TO ORDER · ' + money(unit * s.qty) : 'PART OF THIS IS SOLD OUT',\n      addBg: s.added ? '#3E8C94' : canAdd ? '#C96F4A' : '#6B7F8C',\n      addToOrder: () => {\n        if (!canAdd) return;\n        this.setState(st => ({ cart: [...st.cart, { key: Date.now(), name: d.name, details: d.details, unit, qty: st.qty }], qty: 1, added: true }));\n        clearTimeout(this.addT);\n        this.addT = setTimeout(() => this.setState({ added: false }), 1600);\n      },\n\n      presetCards,\n      baseChips: BASES.map(o => this.chip('base', o, c.base === o.id, false, () => this.setCfg({ base: o.id }), money(o.price))),\n      tempChips: TEMPS.map(o => this.chip(null, o, c.temp === o.id, !b.temps.includes(o.id), () => this.setCfg({ temp: o.id }), '')),\n      milkChips: MILKS.map(o => this.chip('milk', o, c.milk === o.id, !b.milk && o.id !== 'none', () => this.setCfg({ milk: o.id }))),\n      flavorChips: FLAVORS.map(o => this.chip('flavor', o, c.flavor === o.id, false, () => this.setCfg({ flavor: o.id }))),\n      creamChips: CREAMS.map(o => this.chip('cream', o, c.cream === o.id, false, () => this.setCfg({ cream: o.id }))),\n      topChips: TOPPINGS.map(o => this.chip('top', o, c.tops.includes(o.id), false,\n        () => this.setCfg({ tops: c.tops.includes(o.id) ? c.tops.filter(x => x !== o.id) : [...c.tops, o.id] }))),\n      sizeChips: SIZES.map(o => this.chip(null, o, c.size === o.id, false, () => this.setCfg({ size: o.id }))),\n      sugarChips: SUGARS.map(o => ({ label: o.label, sub: o.sub, bg: c.sugar === o.id ? '#123F5E' : '#FBF6E9', fg: c.sugar === o.id ? '#F4E9D2' : '#123F5E', onClick: () => this.setCfg({ sugar: o.id }) })),\n\n      soldToggles: GROUPS.flatMap(([g, gl, arr]) => arr.filter(o => o.id !== 'none').map(o => {\n        const so = this.isSold(g, o.id);\n        return {\n          group: gl, label: o.label, bg: so ? '#F2D9CC' : '#FBF6E9', border: so ? '#C96F4A' : 'rgba(18,63,94,.3)', deco: so ? 'line-through' : 'none',\n          onClick: () => { const sold = { ...s.sold, [g + ':' + o.id]: !so }; save('cc_sold2', sold); this.setState({ sold }); }\n        };\n      })),\n\n      stop: e => e.stopPropagation(),\n      hasCart: s.cart.length > 0 && !s.co && !s.conf,\n      cartSummary: cartCount + (cartCount === 1 ? ' drink' : ' drinks') + ' · ' + money(cartTotalN),\n      cartTotal: money(cartTotalN),\n      openCheckout: () => this.setState({ co: true }),\n      coOpen: s.co, closeCheckout: () => this.setState({ co: false }),\n      cartLines: s.cart.map(l => ({\n        title: l.qty + '× ' + l.name, details: l.details, price: money(l.unit * l.qty),\n        onRemove: () => this.setState(st => { const cart = st.cart.filter(x => x.key !== l.key); return { cart, co: cart.length > 0 }; })\n      })),\n      slotDay: sch.label.toUpperCase(),\n      slotChips: sch.slots.map(m => ({\n        label: fmtMin(m).replace(' AM', ''), bg: s.slot === m ? '#123F5E' : 'transparent', fg: s.slot === m ? '#F4E9D2' : '#123F5E',\n        onClick: () => this.setState({ slot: m })\n      })),\n      name: s.name, phone: s.phone, note: s.note,\n      setName: e => this.setState({ name: e.target.value }),\n      setPhone: e => this.setState({ phone: e.target.value }),\n      setNote: e => this.setState({ note: e.target.value }),\n      canPlace, cantPlace: !canPlace, missingHint: missing || 'Add a drink first',\n      placeOrder: () => this.placeOrder(sch),\n      confOpen: !!s.conf, confNum: s.conf ? s.conf.num : '', confName: s.conf ? s.conf.name : '', confPhone: s.conf ? s.conf.phone : '',\n      confSlot: s.conf ? s.conf.slot : '', confTotal: s.conf ? money(s.conf.total) : '',\n      confClose: () => this.setState({ conf: null }),\n      noOrders: s.orders.length === 0,\n      ownerOrders: s.orders.map(o => ({\n        ...o, totalLabel: money(o.total),\n        onDone: () => { const orders = s.orders.filter(x => x.num !== o.num); save('cc_orders', orders); this.setState({ orders }); }\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
